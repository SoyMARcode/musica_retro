<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Retro Spotify</title>

  <!-- Fuentes retro -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <!-- Tailwind (CDN) y su configuración -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="js/tailwind-config.js"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body class="lineas-crt overflow-x-hidden bg-fondo font-retro text-[22px] text-texto">

  <!-- ============ PANTALLA 1: ENTRADA ============ -->
  <section id="pantalla-entrada" class="pantalla">
    <div class="flex min-h-screen flex-col items-center justify-end gap-4 bg-cover bg-center px-4 pb-[9vh] text-center"
         style="background-image:url('assets/tienda-spotify.jpg')">
      <p class="bg-oscuro/70 px-3 py-2 font-pixel text-[11px] text-amarillo">RETRO EDITION · 1984</p>
      <button id="btn-entrar" class="boton">▶ ENTRAR</button>
      <p class="animate-parpadeo font-pixel text-[10px] text-rosa">OPEN · INSERT COIN</p>
    </div>
  </section>

  <!-- ============ PANTALLA 2: ARTISTAS ============ -->
  <section id="pantalla-artistas" class="pantalla pantalla-fija cuadricula hidden flex flex-col px-4 py-4">
    <header class="mx-auto mb-3 flex w-full max-w-3xl shrink-0 items-center justify-between">
      <div class="flex items-center gap-2.5">
        <span data-logo></span>
        <b class="font-pixel text-[13px] font-normal [text-shadow:2px_2px_0_#ff2e93]">Spotify</b>
      </div>
      <button id="btn-salir" class="border-2 border-cian px-2.5 py-2 font-pixel text-[10px] text-cian">SALIR</button>
    </header>

    <h2 class="mb-3 shrink-0 text-center font-pixel text-xs text-amarillo">ELIGE UN ARTISTA · HITS 80s &amp; 90s</h2>

    <!-- Grid 3x3: ocupa todo el espacio libre -->
    <div id="lista-artistas" class="mx-auto grid min-h-0 w-full max-w-3xl flex-1 grid-cols-3 grid-rows-3 gap-2.5"></div>

    <p class="mt-3 shrink-0 text-center text-lg text-[#b9a3d6]">Toca un artista para abrir sus canciones</p>

    <!-- Cassette: solo aparece en pantallas altas, para no quitarle espacio al grid -->
    <div class="relative mx-auto mt-5 hidden h-[150px] w-[260px] shrink-0 animate-flotar border-4 border-rosa bg-superficie shadow-duro-negro [@media(min-height:820px)]:block" aria-hidden="true">
      <div class="absolute inset-x-3.5 top-3 grid h-[46px] place-items-center border-b-4 border-rosa bg-amarillo font-pixel text-[9px] text-fondo">MIX TAPE 1985</div>
      <div class="absolute inset-x-[46px] top-[68px] flex h-[50px] items-center justify-between border-[3px] border-cian bg-oscuro px-1.5">
        <div class="carrete"></div>
        <div class="carrete"></div>
      </div>
      <div class="absolute inset-x-[60px] -bottom-1 h-3.5 border-[3px] border-b-0 border-rosa bg-oscuro"></div>
    </div>

    <!-- Cinta de hitos que se desplaza -->
    <div class="mt-3 shrink-0 overflow-hidden border-y-[3px] border-cian bg-oscuro py-2" aria-hidden="true">
      <div id="cinta" class="flex w-max animate-marquesina whitespace-nowrap font-pixel text-[11px] text-amarillo"></div>
    </div>
  </section>

  <!-- ============ PANTALLA 3: ABANICO DE CANCIONES ============ -->
  <section id="pantalla-abanico" class="pantalla hidden min-h-screen px-4 py-5">
    <header class="mx-auto mb-4 flex max-w-3xl items-center justify-between">
      <div class="flex items-center gap-2.5">
        <span data-logo></span>
        <b class="font-pixel text-[13px] font-normal [text-shadow:2px_2px_0_#ff2e93]">Spotify</b>
      </div>
      <button id="btn-volver" class="border-2 border-cian px-2.5 py-2 font-pixel text-[10px] text-cian">◀ ARTISTAS</button>
    </header>

    <h2 id="nombre-artista" class="text-center font-pixel text-[13px] leading-relaxed text-amarillo [text-shadow:2px_2px_0_#000]"></h2>

    <!-- Aquí se dibujan las cartas (ver ui.js) -->
    <div id="escenario" class="relative mx-auto mt-3 h-[min(62vw,340px)] min-h-[250px] max-w-3xl touch-pan-y [perspective:900px]"></div>

    <div class="my-2 flex justify-center gap-3.5">
      <button id="btn-izq" class="border-2 border-amarillo px-3 py-2 font-pixel text-xs text-amarillo">◀</button>
      <button id="btn-der" class="border-2 border-amarillo px-3 py-2 font-pixel text-xs text-amarillo">▶</button>
    </div>

    <!-- Barra del reproductor -->
    <div id="reproductor" class="group mx-auto flex max-w-xl items-center gap-2.5 border-[3px] border-cian bg-oscuro/90 px-4 py-3 shadow-duro-rosa">
      <div class="flex h-7 items-end gap-[3px]" aria-hidden="true">
        <i class="h-1.5 w-1.5 bg-verde group-[.sonando]:animate-ecualizador"></i>
        <i class="h-1.5 w-1.5 bg-verde group-[.sonando]:animate-ecualizador [animation-delay:.15s]"></i>
        <i class="h-1.5 w-1.5 bg-verde group-[.sonando]:animate-ecualizador [animation-delay:.3s]"></i>
        <i class="h-1.5 w-1.5 bg-verde group-[.sonando]:animate-ecualizador [animation-delay:.45s]"></i>
      </div>
      <div class="min-w-0 flex-1">
        <div id="rep-titulo" class="truncate">—</div>
        <div id="rep-artista" class="truncate text-lg text-cian"></div>
        <div class="mt-1 h-2 bg-progreso"><span id="rep-progreso" class="block h-full w-0 bg-amarillo"></span></div>
      </div>
      <button id="btn-anterior" class="border-2 border-amarillo px-2.5 py-2 font-pixel text-xs text-amarillo">|◀</button>
      <button id="btn-play" class="border-2 border-amarillo px-2.5 py-2 font-pixel text-xs text-amarillo">▶</button>
      <button id="btn-siguiente" class="border-2 border-amarillo px-2.5 py-2 font-pixel text-xs text-amarillo">▶|</button>
    </div>

    <p class="mt-4 text-center text-lg text-[#d9c6f2]">Desliza o usa las flechas · toca la carta central para reproducir</p>
  </section>

  <!-- Orden importante: datos → interfaz → reproductor → conexión de botones -->
  <script src="js/data.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/player.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
